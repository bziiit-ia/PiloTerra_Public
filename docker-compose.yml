# =====================================================================
#  PiloTerra — pile locale : Supabase + n8n
#
#  Démarrage, depuis la racine du dépôt :
#    cp .env.example .env
#    docker compose up -d
#    npm run dev            # portail sur http://localhost:3000
#
#  Adresses :
#    http://localhost:8000  API Supabase, et Studio (DASHBOARD_USERNAME /
#                           DASHBOARD_PASSWORD de .env)
#    http://localhost:5678  n8n
#    127.0.0.1:54322        Postgres (utilisateur postgres)
#
#  Au premier démarrage, le service « migrations » applique les scripts
#  de sql/ dans l'ordre de sql/ordre.txt, puis s'arrête. À chaque
#  démarrage suivant, il n'applique que les scripts nouveaux.
#  Repartir d'une base vide : docker compose down -v
#
#  Images : variables *_IMAGE de .env (versions du dev par défaut).
#  Services Supabase non embarqués, inutiles au portail : realtime,
#  edge functions, analytics, pooler.
#
#  Pile de POSTE DE DÉVELOPPEMENT : secrets publics, ports sur
#  127.0.0.1. Ne pas déployer tel quel.
# =====================================================================

name: piloterra

x-postgres-env: &postgres-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: postgres

services:

  # -------------------------------------------------------------------
  #  Supabase
  # -------------------------------------------------------------------
  db:
    image: ${SUPABASE_POSTGRES_IMAGE:-supabase/postgres:17.6.1.136}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${POSTGRES_PORT_LOCAL:-54322}:5432
    volumes:
      - ./docker/supabase/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro,Z
      - ./docker/supabase/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro,Z
      - ./docker/supabase/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro,Z
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  auth:
    image: ${SUPABASE_AUTH_IMAGE:-supabase/gotrue:v2.189.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${SUPABASE_PORT:-8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-http://localhost:3000}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: http://localhost:${SUPABASE_PORT:-8000}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: ${SUPABASE_REST_IMAGE:-postgrest/postgrest:v14.12}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  storage:
    image: ${SUPABASE_STORAGE_IMAGE:-supabase/storage-api:v1.60.4}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - storage-data:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://localhost:${SUPABASE_PORT:-8000}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"

  meta:
    image: ${SUPABASE_META_IMAGE:-supabase/postgres-meta:v0.96.6}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: ${SUPABASE_STUDIO_IMAGE:-supabase/studio:2026.08.03-sha-022b374}
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    environment:
      <<: *postgres-env
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      DEFAULT_ORGANIZATION_NAME: PiloTerra
      DEFAULT_PROJECT_NAME: PiloTerra local
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:${SUPABASE_PORT:-8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  kong:
    image: ${SUPABASE_KONG_IMAGE:-kong/kong:3.9.3}
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    ports:
      - 127.0.0.1:${SUPABASE_PORT:-8000}:8000
    volumes:
      - ./docker/supabase/kong.yml:/home/kong/temp.yml:ro,z
      - ./docker/supabase/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/bash", "/home/kong/kong-entrypoint.sh"]

  # Applique les scripts de sql/ puis s'arrête (voir appliquer-sql.sh).
  migrations:
    image: ${SUPABASE_POSTGRES_IMAGE:-supabase/postgres:17.6.1.136}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./sql:/sql:ro,z
      - ./docker/supabase/appliquer-sql.sh:/appliquer-sql.sh:ro,z
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/bash", "/appliquer-sql.sh"]

  # -------------------------------------------------------------------
  #  n8n — instance vide : les scénarios PiloTerra sont à importer.
  # -------------------------------------------------------------------
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.43.5}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${N8N_PORT:-5678}:5678
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Pour les scénarios : Supabase est joignable à http://kong:8000
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

volumes:
  db-data:
  db-config:
  storage-data:
  n8n-data:
