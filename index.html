    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Inter', 'sans-serif'], // Could be swapped for a serif if needed later
            },
            // Couleurs du marché actif (étape 10) : emerald et pilo-green /
            // dark / light / brown lisent des variables CSS, posées par
            // components/paletteMarche.ts. Valeurs par défaut plus bas, dans
            // :root = palette historique (vitrine et agriculture).
            // Les états (publié, présent, succès, copié…) utilisent
            // « succes » : les valeurs exactes de l'emerald historique,
            // figées, pour ne pas changer de sens avec le marché.
            colors: {
              succes: {
                50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                800: '#065f46', 900: '#064e3b', 950: '#022c22'
              },
              emerald: {
                50: 'rgb(var(--accent-50) / <alpha-value>)',
                100: 'rgb(var(--accent-100) / <alpha-value>)',
                200: 'rgb(var(--accent-200) / <alpha-value>)',
                300: 'rgb(var(--accent-300) / <alpha-value>)',
                400: 'rgb(var(--accent-400) / <alpha-value>)',
                500: 'rgb(var(--accent-500) / <alpha-value>)',
                600: 'rgb(var(--accent-600) / <alpha-value>)',
                700: 'rgb(var(--accent-700) / <alpha-value>)',
                800: 'rgb(var(--accent-800) / <alpha-value>)',
                900: 'rgb(var(--accent-900) / <alpha-value>)',
                950: 'rgb(var(--accent-950) / <alpha-value>)'
              },
              pilo: {
                green: 'rgb(var(--pilo-green) / <alpha-value>)',
                brown: 'rgb(var(--pilo-brown) / <alpha-value>)',
                dark: 'rgb(var(--pilo-dark) / <alpha-value>)',
                light: 'rgb(var(--pilo-light) / <alpha-value>)',
                cream: '#f8f7f1',
                gold: '#d4af37' // Added for accents
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'blob': 'blob 7s infinite',
              'shimmer': 'shimmer 2s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              shimmer: {
                from: { backgroundPosition: '0 0' },
                to: { backgroundPosition: '-200% 0' },
              }
            },
            backgroundImage: {
              'grid-pattern': "url(\"data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231b5e1f' fill-opacity='0.05' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E\")",
              'dots-pattern': "url(\"data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231b5e1f' fill-opacity='0.05' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3C/g%3E%3C/svg%3E\")",
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Palette historique PiloTerra, en canaux RGB (format attendu par
         Tailwind pour les opacités : bg-emerald-600/20…). Remplacée sur
         <html> par la palette du marché actif (paletteMarche.ts). */
      :root {
        --accent-50: 236 253 245;
        --accent-100: 209 250 229;
        --accent-200: 167 243 208;
        --accent-300: 110 231 183;
        --accent-400: 52 211 153;
        --accent-500: 16 185 129;
        --accent-600: 5 150 105;
        --accent-700: 4 120 87;
        --accent-800: 6 95 70;
        --accent-900: 6 78 59;
        --accent-950: 2 44 34;
        --pilo-green: 27 94 31;
        --pilo-dark: 13 51 16;
        --pilo-light: 242 252 243;
        --pilo-brown: 167 122 21;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f7f1; /* PiloTerra Cream Base */
        color: rgb(var(--pilo-green));
      }
      
      /* Smooth Scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Scrollbar Customization */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      .glass-nav {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgb(var(--pilo-green) / 0.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
      }

      .text-gradient-pilo {
        background: linear-gradient(135deg, rgb(var(--pilo-green)) 0%, rgb(var(--pilo-dark)) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .text-gradient-gold {
        background: linear-gradient(135deg, rgb(var(--pilo-brown)) 0%, rgb(var(--pilo-brown) / 0.75) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
